name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# package-lock.json is deliberately not tracked, so every run resolves the
# dependency ranges in package.json afresh. That is why there is no `npm ci`
# and no npm cache here, and why a run can differ from the previous one
# without any change in this repo.

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  # Fails on high or critical advisories in any installed package, dev tools
  # included. Lower severities are reported but do not fail. On a pull request
  # any finding is posted as one sticky comment (updated in place); when the
  # audit is clean the comment is removed and the green check is the signal.
  # npm audit has no allowlist: to accept a specific high advisory, fix or
  # override the dependency, or temporarily drop this job from the required
  # checks — never lower the threshold for everyone.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # Resolve the dependency tree into a throwaway lockfile; nothing is
      # downloaded into node_modules and no install scripts run.
      - name: Resolve dependency tree
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Audit dependencies
        id: audit
        run: |
          set +e
          npm audit --json > audit.json
          npm audit --audit-level=high > audit.txt
          echo "status=$?" >> "$GITHUB_OUTPUT"
          cat audit.txt
          {
            echo '## npm audit (fails on high and critical)'
            echo
            echo '```'
            cat audit.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Fork PRs get a read-only token, so commenting may fail there; the
      # threshold below still decides the job result.
      - name: Comment on pull request
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const MARKER = '<!-- npm-audit-report -->';
            const report = JSON.parse(fs.readFileSync('audit.json', 'utf8'));
            const counts = report.metadata?.vulnerabilities ?? {};
            const vulns = Object.values(report.vulnerabilities ?? {});
            const levels = ['critical', 'high', 'moderate', 'low', 'info'];

            let body = null;
            if (vulns.length > 0) {
              const failing = (counts.critical ?? 0) + (counts.high ?? 0) > 0;
              const rank = (v) => levels.indexOf(v.severity);
              const rows = vulns
                .sort((a, b) => rank(a) - rank(b) || a.name.localeCompare(b.name))
                .map((v) => {
                  const fix = v.fixAvailable === true ? 'yes'
                    : v.fixAvailable ? `${v.fixAvailable.name}@${v.fixAvailable.version}${v.fixAvailable.isSemVerMajor ? ' (major)' : ''}`
                    : 'no';
                  const via = v.via.map((x) => typeof x === 'string' ? x : `[${x.title}](${x.url})`).join('<br>');
                  return `| ${v.severity} | \`${v.name}\` | ${v.isDirect ? 'direct' : 'transitive'} | ${fix} | ${via} |`;
                });
              let text = fs.readFileSync('audit.txt', 'utf8').trim();
              if (text.length > 30000) text = text.slice(0, 30000) + '\n… truncated, see the job log';
              body = [
                MARKER,
                '## npm audit found vulnerable dependencies',
                '',
                failing
                  ? '**This fails CI:** there are high or critical advisories.'
                  : 'Below the failure threshold (high): reported only, CI is not blocked.',
                '',
                `Critical ${counts.critical ?? 0} · High ${counts.high ?? 0} · Moderate ${counts.moderate ?? 0} · Low ${counts.low ?? 0}`,
                '',
                '| Severity | Package | Dependency | Fix | Advisories / via |',
                '| --- | --- | --- | --- | --- |',
                ...rows,
                '',
                '<details><summary>Full npm audit output</summary>',
                '',
                '```',
                text,
                '```',
                '</details>',
              ].join('\n');
            }

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((c) => c.body?.includes(MARKER));
            if (!body) {
              if (existing) await github.rest.issues.deleteComment({ owner, repo, comment_id: existing.id });
            } else if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Enforce audit threshold
        run: exit ${{ steps.audit.outputs.status }}
